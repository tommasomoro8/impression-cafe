<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>server ue5</title>
</head>
<body>
    <div id="container">
        <div class="chat-container active" id="chat-monet">

        </div>
        <div class="chat-container" id="chat-seurat">
        
        </div>
        <div class="chat-container" id="chat-degas">
        
        </div>

        <div id="button-container">
            <div id="action" class="start-recording">Start recording</div>
            <!-- <div class="author-selector selected" id="monet">Monet</div>
            <div class="author-selector" id="seurat">Seurat</div>
            <div class="author-selector" id="degas">Degas</div> -->
        </div>
    </div>

    <script>
        const sessionId = "6KdZpREDAReP4phtCsMt"
        const authorId = "chat-monet"
        const writePermissionPassword = "OHTnJjsdxeNT7SPsI9pgrKuaqEpFCE"

        let mediaRecorder
        let audioChunks = []
        let appState = "ready" // recording, loading

        const actionButton = document.getElementById("action")

        actionButton.addEventListener("click", () => {
            if (appState === "ready") {
                startRecording()
            } else if (appState === "recording") {
                stopRecording()
            }
        })

        function startRecording() {
            navigator.mediaDevices
                .getUserMedia({ audio: true })
                .then(function (stream) {
                    mediaRecorder = new MediaRecorder(stream)

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0)
                            audioChunks.push(event.data)
                    }

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: "audio/wav" })

                        sendAudioDataToServer(audioBlob)

                        audioChunks = []
                    }

                    mediaRecorder.start()
                    
                    document.getElementById("action").innerText = "Stop recording"
                    document.getElementById("action").className = "stop-recording"
                    appState = "recording"
                })
                .catch((err) => {
                    console.error("Error accessing the microphone: " + err);
                })
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== "inactive") {
                mediaRecorder.stop()

                document.getElementById("action").innerText = ""
                document.getElementById("action").className = "loading"
                appState = "loading"
            }
        }

        async function sendAudioDataToServer(audioBlob) {
            const formData = new FormData()
            formData.append("audio", audioBlob, "test.wav")

            const myHeaders = new Headers();
            myHeaders.append("writepermissionpassword", writePermissionPassword)
        
            const result = await fetch("http://localhost:3000/api/" + sessionId + "/new-chat/" + authorId, {
                method: 'post',
                headers: myHeaders,
                body: formData,
                redirect: 'follow'
            })
    
            console.log(result)
            const responsejson = await result.json()
            console.log(responsejson)

            const userResponse = document.createElement("div")
            userResponse.className = "message user-message"
            userResponse.innerText = responsejson.audioTranscription
            document.getElementById("chat-monet").append(userResponse)

            const userAudio = document.createElement("div")
            userAudio.className = "message user-audio"
                const userAudioElement = document.createElement("audio")
                userAudioElement.controls = true
                    const userAudioSourceElement = document.createElement("source")
                    userAudioSourceElement.src = "http://localhost:3000/audio/" + sessionId + "/" + responsejson.audioId
                    userAudioSourceElement.type = "audio/wav"
                    userAudioElement.append(userAudioSourceElement)
                userAudio.append(userAudioElement)
            document.getElementById("chat-monet").append(userAudio)

            const botResponse = document.createElement("div")
            botResponse.className = "message bot-message"
            botResponse.innerText = responsejson.response
            document.getElementById("chat-monet").append(botResponse)

            const botAudio = document.createElement("div")
            botAudio.className = "message bot-audio"
                const botAudioElement = document.createElement("audio")
                botAudioElement.controls = true
                    const botAudioSourceElement = document.createElement("source")
                    botAudioSourceElement.src = "http://localhost:3000/audio/" + sessionId + "/" + responsejson.assistantAudioId
                    botAudioSourceElement.type = "audio/wav"
                    botAudioElement.append(botAudioSourceElement)
                    botAudio.append(botAudioElement)
            document.getElementById("chat-monet").append(botAudio)

            botAudioElement.play()

            document.getElementById("chat-monet").scrollTo(0, document.getElementById("chat-monet").scrollHeight);

            document.getElementById("action").innerText = "Start recording"
            document.getElementById("action").className = "start-recording"
            appState = "ready"
        }
    </script>

    <style>

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-user-drag: none;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-family: -apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #141414;
            overflow: hidden;
        }

        .center {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .row {
            display: flex;
            flex-direction: row;
        }

        .column {
            display: flex;
            flex-direction: column;
        }

        .pointer {
            cursor: pointer;
        }

        #container {
            width: 100vw;
            height: 100vh;

            max-width: 630px;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-direction: column;

            background-color: #141414;
        }

        #button-container {
            width: 100%;
            height: 100px;
            /* background-color: #00000047; */


            display: flex;
            justify-content: space-evenly;
            align-items: center;
            flex-direction: row;
        }

        #action {
            color: #141414;
            height: 50px;
            padding-left: 40px;
            padding-right: 40px;
            border-radius: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            transition: width 1s cubic-bezier(0.075, 0.82, 0.165, 1), color 1s cubic-bezier(0.075, 0.82, 0.165, 1), background-color 1s cubic-bezier(0.075, 0.82, 0.165, 1);
        }

        #action.start-recording {
            cursor: pointer;
            background-color: #00dc8c;
            color: black;
            width: 200px;
        }

        #action.stop-recording {
            cursor: pointer;
            background-color: #dc0000;
            color: white;
            width: 200px;
        }


        @keyframes pulse {
            0% {
                transform: scale(.8);
            }
            50% {
                transform: scale(1.3);
            }
            100% {
                transform: scale(.8);
            }
        }

        #action.loading {
            cursor: pointer;
            background-color: #dcdcdc;
            color: transparent;
            width: 50px;
            height: 50px;
            margin: 0;
            padding: 0;
            animation: pulse 1.5s infinite;
        }

        .author-selector {
            background-color: #28a08c;
            color: #141414;
            width: 130px;
            height: 50px;
            border-radius: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;
        }

        .author-selector.selected {
            background-color: #00dc8c;
            color: #141414;

            cursor: default;
        }

        .chat-container {
            display: none;

            /* background-color: red; */
            width: 100%;
            height: calc(100vh - 100px);

            margin-top: 50px;

            justify-content: left;
            align-items: end;
            flex-direction: column;


            overflow-y: scroll;
        }

        .chat-container.active {
            display: flex;
        }

        .user-audio {
            align-self: self-end;
            
        }

        .bot-audio {
            align-self: self-start;
            
        }

        .user-message {
            align-self: self-end;
            background-color: #28a08c;
            max-width: 300px;
            padding: 10px;
            border-radius: 20px;
            border-end-end-radius: 0px;
            color: white;
        }

        .bot-message {
            align-self: self-start;
            background-color: #dcdcdc;
            max-width: 300px;
            padding: 10px;
            border-radius: 20px;
            border-end-start-radius: 0px;
            color: black;
        }

        .message {
            margin-top: 5px;
            margin-bottom: 5px;
        }
        
    </style>
</body>
</html>
